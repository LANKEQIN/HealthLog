org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# 关闭 Kotlin 增量编译：插件源码位于 C 盘 pub cache、工程位于 D 盘时，
# 增量缓存会因跨盘符（different roots）抛异常，关闭后构建日志更干净、更稳定
kotlin.incremental=false

# 关闭 release 构建的 R8 代码缩减/混淆：
# Flutter 3.47 的 Gradle 插件默认会开启它（FlutterPluginUtils.shouldShrinkResources
# 在未显式设置 shrink 属性时默认返回 true），并会混淆所有非 keep 的类。
# 但本工程依赖的 shared_preferences_android 2.5.0 改用 package:jni，通过 JNI 按
# 「原始 JVM 方法签名」反射调用 Kotlin 侧的 suspend 方法；这些方法的签名与方法体里
# 引用了 kotlin.coroutines.Continuation、kotlin.coroutines.intrinsics.CoroutineSingletons、
# kotlin.jvm.internal.DefaultConstructorMarker 等 Kotlin 内部类型，一旦被 R8 改名，
# JNI 反射就会抛 NoSuchMethodError / ClassNotFoundException，导致应用在 main() 阶段
# （runApp 之前）崩溃并卡在启动页。这里显式关闭 R8 以规避该插件兼容性问题。
shrink=false
